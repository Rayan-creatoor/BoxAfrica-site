name: Keep chat server awake

# Le serveur de chat tourne sur le plan gratuit de Render, qui se met en veille
# après 15 min d'inactivité (le réveil prend 30-50s et peut provoquer des
# erreurs réseau côté widget). Cette tâche ping /api/health toutes les 10 min
# pour que le service ne s'endorme jamais.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sS -o /dev/null -w "Statut: %{http_code}\n" --max-time 60 \
            https://boxafrica-chat-server-8cep.onrender.com/api/health
